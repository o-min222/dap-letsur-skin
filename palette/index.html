<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>LETSUR 렛서판다</title>
  <link rel="stylesheet" href="style.css">
  <script src="../assets/catalog.js" defer></script>
  <script src="preview.js" defer></script>
</head>
<body>
  <main>
    <header><a class="wordmark" aria-label="LETSUR">LETSUR<span>®</span></a><button id="close" class="close" aria-label="창 닫기">×</button></header>
    <div class="intro"><p class="eyebrow">YOUR EVERYDAY COMPANION</p><h1>모든 길은<br>렛서로 통한다<span>.</span></h1><p>사람과 AI가 함께 성장하는 길,<br>렛서판다가 곁에 있을게요.</p></div>
    <section class="stage" aria-label="렛서판다 모션 미리보기"><div class="halo"></div><canvas id="pet" width="192" height="208" role="img" aria-label="렛서판다"></canvas><span id="motion-name">잠깐 쉬는 중</span><button id="pause" aria-label="애니메이션 일시정지" aria-pressed="false">Ⅱ</button></section>
    <div class="controls"><label for="motion">렛서판다의 하루</label><select id="motion"></select></div>
    <div class="actions"><button id="apply" class="primary" disabled>렛서판다와 함께하기 <span>↗</span></button><button id="reset" class="secondary" disabled>기본 캐릭터로 돌아가기</button></div>
    <p id="status" role="status" aria-live="polite">미리보기를 준비하고 있어요.</p>
    <footer><span class="dot"></span> 작은 호기심이, 함께하는 성장으로.</footer>
  </main>
</body>
</html>
